name: Desktop CE Nightly

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: desktop-ce-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://downloads.bitsentry.ai' }}

jobs:
  change-gate:
    name: Change gate and release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      nightly_date: ${{ steps.gate.outputs.nightly_date }}
      nightly_version: ${{ steps.gate.outputs.nightly_version }}
      nightly_tag: ${{ steps.gate.outputs.nightly_tag }}
      r2_prefix: ${{ steps.gate.outputs.r2_prefix }}
      artifact_version_segment: ${{ steps.gate.outputs.artifact_version_segment }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      MAC_CSC_PASSWORD: ${{ secrets.MAC_CSC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve change gate and release identifiers
        id: gate
        shell: bash
        run: bash scripts/release/resolve-nightly-gate.sh

      - name: Validate release secrets before using macOS minutes
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: bash scripts/release/check-nightly-release-secrets.sh

  quality:
    name: Desktop CE quality and smoke checks
    if: needs.change-gate.outputs.should_run == 'true'
    needs: change-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize package submodules
        shell: bash
        run: bash scripts/release/init-nightly-submodules.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libgbm1 \
            libatk-bridge2.0-0

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/electron-trpc install --frozen-lockfile

      - name: Run TypeScript 6 ESLint bridge
        run: pnpm run lint:ts6

      - name: Ensure Electron binary is installed
        run: pnpm --dir apps/desktop exec node node_modules/electron/install.js

      - name: Run desktop tests
        run: pnpm --filter @bitsentry-ce/desktop test

      - name: Install desktop native dependencies
        run: pnpm --dir apps/desktop run prepare:native-deps

      - name: Build Desktop CE
        run: pnpm run build

      - name: Run CE runbook smoke test
        env:
          BITSENTRY_DESKTOP_SMOKE_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm run desktop:test:smoke:runbook

  package-macos-arm64:
    name: Package signed macOS arm64 artifact
    if: needs.change-gate.outputs.should_run == 'true'
    needs: [change-gate, quality]
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NIGHTLY_DATE: ${{ needs.change-gate.outputs.nightly_date }}
      NIGHTLY_VERSION: ${{ needs.change-gate.outputs.nightly_version }}
      NIGHTLY_TAG: ${{ needs.change-gate.outputs.nightly_tag }}
      R2_PREFIX: ${{ needs.change-gate.outputs.r2_prefix }}
      ARTIFACT_VERSION_SEGMENT: ${{ needs.change-gate.outputs.artifact_version_segment }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://downloads.bitsentry.ai' }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.MAC_CSC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize package submodules
        shell: bash
        run: bash scripts/release/init-nightly-submodules.sh

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/electron-trpc install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm run build:packages
          pnpm --dir packages/electron-trpc --filter electron-trpc build

      - name: Build desktop scripts and package the app
        working-directory: apps/desktop
        run: bash ../../scripts/release/package-nightly-macos.sh

      - name: Verify packaged app and distributables
        working-directory: apps/desktop
        run: bash ../../scripts/release/verify-nightly-macos-artifact.sh

      - name: Prepare nightly updater manifest
        working-directory: apps/desktop
        run: |
          node scripts/dist/rewrite-update-manifest.js \
            --input release/build/latest-mac.yml \
            --output release/build/channel-feed/latest-mac.yml \
            --url-prefix "${ARTIFACT_VERSION_SEGMENT}"

      - name: Verify and upload isolated nightly artifacts to R2
        working-directory: apps/desktop
        run: bash ../../scripts/release/upload-nightly-artifacts.sh

      - name: Publish GitHub prerelease
        working-directory: apps/desktop
        run: bash ../../scripts/release/publish-nightly-prerelease.sh
